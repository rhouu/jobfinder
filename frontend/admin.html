<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — JobFinder.ma</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
</head>
<body>
  <div class="dash">
    <aside class="sidebar">
      <div class="s-label" data-i18n="adm.platform"></div>
      <button class="side-link" data-panel="analytics"><i data-icon="chart"></i> <span data-i18n="adm.analytics"></span></button>
      <button class="side-link" data-panel="users"><i data-icon="users"></i> <span data-i18n="adm.users"></span></button>
      <button class="side-link" data-panel="companies"><i data-icon="building"></i> <span data-i18n="nav.companies"></span> <span class="count" id="pendingCount">0</span></button>
      <button class="side-link" data-panel="jobs"><i data-icon="briefcase"></i> <span data-i18n="adm.offers"></span></button>
      <button class="side-link" data-panel="reviews"><i data-icon="star"></i> <span data-i18n="reviews.title"></span></button>
      <div class="side-card"><strong><i data-icon="shield" data-size="16"></i> <span data-i18n="adm.mode"></span></strong><div class="muted" style="margin-top:6px" data-i18n="adm.modeText"></div></div>
    </aside>
    <main class="dash-main">
      <section class="panel" id="panel-analytics">
        <div class="dash-head"><div><p class="muted" data-i18n="adm.administration"></p><h1 data-i18n-html="adm.title"></h1></div>
          <div class="row"><span class="muted small" id="refreshInfo"></span>
            <button class="btn btn-ghost btn-sm" id="refreshBtn"><i data-icon="layers" data-size="15"></i> <span data-i18n="adm.refreshOffers"></span></button>
            <button class="btn btn-ghost btn-sm" id="backupBtn"><i data-icon="upload" data-size="15"></i> <span data-i18n="adm.backup"></span></button>
            <span class="badge" id="aiBadge"></span></div></div>
        <div class="kpis">
          <div class="card kpi"><div class="k-top"><span class="k-label" data-i18n="adm.totalUsers"></span><span class="k-icon" style="--kc:#5b8def"><i data-icon="users"></i></span></div><div class="k-val" id="tUsers">0</div><span class="muted small" id="tUsersSub"></span><span class="k-delta" id="tUsersWeek"></span></div>
          <div class="card kpi"><div class="k-top"><span class="k-label" data-i18n="co.openOffers"></span><span class="k-icon" style="--kc:#f2a33a"><i data-icon="briefcase"></i></span></div><div class="k-val" id="tJobs">0</div><span class="muted small" id="tJobsSub"></span><span class="k-delta" id="tJobsType"></span></div>
          <div class="card kpi"><div class="k-top"><span class="k-label" data-i18n="nav.applications"></span><span class="k-icon" style="--kc:#9b7ede"><i data-icon="mail"></i></span></div><div class="k-val" id="tApps">0</div><span class="muted small" id="tAppsSub"></span><span class="k-delta" id="tAppsWeek"></span></div>
          <div class="card kpi"><div class="k-top"><span class="k-label" data-i18n="adm.companyAccounts"></span><span class="k-icon" style="--kc:#2e9e74"><i data-icon="building"></i></span></div><div class="k-val" id="tCompanies">0</div><span class="muted small" id="tCompaniesSub"></span><span class="k-delta" id="tDirectory"></span></div>
        </div>
        <div class="grid-3-1 adm-row">
          <div class="card">
            <div class="card-title adm-chart-head"><h3 id="activityTitle"></h3>
              <div class="view-switch" role="group" id="rangeSwitch"><button data-days="7">7 <span data-i18n="adm.daysShort"></span></button><button data-days="30" class="active">30 <span data-i18n="adm.daysShort"></span></button><button data-days="90">90 <span data-i18n="adm.daysShort"></span></button></div></div>
            <div class="legend adm-legend"><span style="--c:var(--series-1)"><span data-i18n="adm.newUsers"></span> <strong id="sumUsers"></strong></span><span style="--c:var(--series-2)"><span data-i18n="nav.applications"></span> <strong id="sumApps"></strong></span></div>
            <div id="lineChart" class="line-wrap"></div>
          </div>
          <div class="card"><h3 style="margin-bottom:12px" data-i18n="adm.todo"></h3><div id="todoList" class="todo-list"></div></div>
        </div>
        <div class="grid-2 adm-row">
          <div class="card"><h3 style="margin-bottom:16px" data-i18n="adm.byStatus"></h3><div class="bar-chart" id="statusChart"></div></div>
          <div class="card"><h3 style="margin-bottom:16px" data-i18n="adm.bySector"></h3><div class="bar-chart" id="sectorChart"></div></div>
        </div>
        <div class="grid-2">
          <div class="card"><h3 style="margin-bottom:16px" data-i18n="adm.byCity"></h3><div class="bar-chart" id="cityChart"></div></div>
          <div class="card"><div class="card-title"><h3 data-i18n="adm.recentUsers"></h3><a href="#users" class="small" data-i18n="adm.seeAll"></a></div><div id="recentUsers" class="recent-users"></div></div>
        </div>
      </section>

      <section class="panel" id="panel-users">
        <div class="dash-head"><div><h1 data-i18n="adm.users"></h1><p class="muted" data-i18n="adm.usersSub"></p></div>
          <div class="row"><input class="input" id="userQ" data-i18n-ph="adm.searchUsers" style="width:240px"><select class="select" id="userRole" style="width:auto"><option value="" data-i18n="adm.allRoles"></option><option value="student" data-i18n="role.student"></option><option value="company" data-i18n="role.company"></option><option value="admin" data-i18n="role.admin"></option></select></div></div>
        <div class="table-wrap"><table><thead><tr><th data-i18n="adm.user"></th><th data-i18n="adm.role"></th><th data-i18n="adm.signin"></th><th data-i18n="adm.joined"></th><th data-i18n="co.status"></th><th></th></tr></thead><tbody id="usersTable"></tbody></table></div>
      </section>

      <section class="panel" id="panel-companies">
        <div class="dash-head"><div><h1 data-i18n="nav.companies"></h1><p class="muted" data-i18n="adm.companiesSub2"></p></div>
          <div class="view-switch" id="coView">
            <button data-view="accounts" class="active" data-i18n="adm.accounts"></button>
            <button data-view="directory"><span data-i18n="adm.directoryTab"></span> <span class="muted" id="dirTotal"></span></button>
          </div></div>

        <!-- Companies with an account (or from job boards) -->
        <div id="coAccounts">
          <div class="row" style="justify-content:flex-end;margin-bottom:12px">
            <select class="select" id="coStatus" style="width:auto"><option value="" data-i18n="adm.allStatuses"></option><option value="pending" selected data-i18n="verif.pending"></option><option value="verified" data-i18n="verif.verified"></option><option value="unverified" data-i18n="verif.unverified"></option><option value="rejected" data-i18n="verif.rejected"></option></select></div>
          <div class="table-wrap"><table><thead><tr><th data-i18n="auth.company"></th><th data-i18n="adm.owner"></th><th>ICE / RC</th><th data-i18n="adm.offers"></th><th data-i18n="co.status"></th><th></th></tr></thead><tbody id="coTable"></tbody></table></div>
        </div>

        <!-- Marrakech directory: private emails, spontaneous applications -->
        <div id="coDirectory" class="hidden">
          <div class="row" style="margin-bottom:12px">
            <input class="input grow" id="dirQ" data-i18n-ph="adm.dirSearch">
            <select class="select" id="dirShow" style="width:auto">
              <option value="" data-i18n="adm.dirAll"></option><option value="email" data-i18n="adm.dirEmail"></option>
              <option value="noemail" data-i18n="adm.dirNoEmail"></option><option value="optout" data-i18n="adm.dirOptout"></option></select>
          </div>
          <div class="table-wrap"><table><thead><tr><th data-i18n="auth.company"></th><th data-i18n="adm.dirArea"></th><th data-i18n="adm.dirEmailCol"></th><th data-i18n="adm.dirApps"></th><th data-i18n="co.status"></th><th></th></tr></thead><tbody id="dirTable"></tbody></table></div>
          <div class="pagination" id="dirPages"></div>
        </div>
      </section>

      <section class="panel" id="panel-jobs">
        <div class="dash-head"><div><h1 data-i18n="adm.offers"></h1><p class="muted" data-i18n="adm.offersSub"></p></div><input class="input" id="jobQ" data-i18n-ph="adm.searchOffers" style="width:260px"></div>
        <div class="table-wrap"><table><thead><tr><th data-i18n="co.offer"></th><th data-i18n="auth.company"></th><th data-i18n="jobs.type"></th><th data-i18n="nav.applicants"></th><th data-i18n="co.status"></th><th></th></tr></thead><tbody id="jobsTable"></tbody></table></div>
      </section>

      <section class="panel" id="panel-reviews">
        <div class="dash-head"><div><h1 data-i18n="reviews.title"></h1><p class="muted" data-i18n="adm.reviewsSub"></p></div></div>
        <div class="table-wrap"><table><thead><tr><th data-i18n="auth.company"></th><th data-i18n="reviews.rating"></th><th data-i18n="reviews.titleLabel"></th><th data-i18n="adm.author"></th><th></th></tr></thead><tbody id="reviewsTable"></tbody></table></div>
      </section>
    </main>
  </div>
  <!-- Animation libraries: GSAP (+ScrollTrigger, SplitText). Lenis smooth scrolling is loaded by app.js. If they fail to load, the site still works. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
