<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — JobFinder.ma</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2e9e74">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
</head>
<body data-page="auth">
  <main class="auth-wrap auth-v2">
    <!-- Left: four characters whose eyes follow the mouse; they look at what you type and look away from passwords -->
    <section class="auth-side auth-chars" aria-hidden="true">
      <div class="chars-stage">
        <div class="chars" id="chars">
          <div class="ch ch-tall" data-ch="tall"><div class="face"><div class="brows"><i></i><i></i></div><div class="eyes"><span class="eye"><i></i></span><span class="eye"><i></i></span></div><svg class="mouth" viewBox="0 0 40 24" aria-hidden="true"><path d=""/></svg></div></div>
          <div class="ch ch-dark" data-ch="dark"><div class="face"><div class="eyes"><span class="eye"><i></i></span><span class="eye"><i></i></span></div><svg class="mouth" viewBox="0 0 40 24" aria-hidden="true"><path d=""/></svg></div></div>
          <div class="ch ch-yellow" data-ch="yellow"><div class="face"><div class="brows"><i></i><i></i></div><div class="eyes"><span class="eye"><i></i></span><span class="eye"><i></i></span></div><div class="blush"><i></i><i></i></div><svg class="mouth" viewBox="0 0 40 24" aria-hidden="true"><path d=""/></svg></div></div>
          <div class="ch ch-orange" data-ch="orange"><div class="face"><div class="brows"><i></i><i></i></div><div class="eyes"><span class="eye"><i></i></span><span class="eye"><i></i></span></div><div class="blush"><i></i><i></i></div><svg class="mouth" viewBox="0 0 40 24" aria-hidden="true"><path d=""/></svg></div></div>
        </div>
      </div>
    </section>

    <section class="auth-form-wrap">
      <!-- Sign in / register -->
      <div class="auth-card card fade-up" id="mainCard" style="--d:.15s">
        <div class="tabs" role="tablist"><span class="indicator"></span>
          <button type="button" data-tab="login" class="active" data-i18n="nav.signin"></button>
          <button type="button" data-tab="register" data-i18n="auth.create"></button>
        </div>
        <div id="roleWrap" class="hidden" style="margin-bottom:18px">
          <div class="role-pick">
            <label><input type="radio" name="role" value="student" checked><div class="role-box"><i data-icon="user" data-size="24"></i><strong data-i18n="auth.student"></strong><div class="muted small" data-i18n="auth.studentSub"></div></div></label>
            <label><input type="radio" name="role" value="company"><div class="role-box"><i data-icon="building" data-size="24"></i><strong data-i18n="auth.company"></strong><div class="muted small" data-i18n="auth.companySub"></div></div></label>
          </div>
        </div>
        <form id="authForm" class="form-grid" style="grid-template-columns:1fr" novalidate>
          <div class="field hidden" data-only="register"><label for="name" data-i18n="auth.name"></label><input class="input" id="name" name="name" autocomplete="name"></div>
          <div class="field hidden" data-only="company"><label for="company_name" data-i18n="auth.companyName"></label><input class="input" id="company_name" name="company_name"></div>
          <div class="field"><label for="email" data-i18n="auth.email"></label><input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.ma"></div>
          <div class="field"><label for="password" data-i18n="auth.password"></label><div class="pw-wrap"><input class="input" id="password" name="password" type="password" autocomplete="current-password">
            <button type="button" class="pw-eye" id="pwEye" data-i18n-aria="auth.showPw"><i data-icon="eye" data-size="18"></i></button></div>
            <small class="muted hidden" data-only="register" data-i18n="auth.pwHint"></small></div>
          <button class="btn btn-primary btn-lg btn-block btn-shine" type="submit" id="submitBtn"></button>
          <p class="muted small hidden consent" data-only="register" data-i18n-html="auth.consent"></p>
          <button type="button" class="link-btn" id="forgotLink" data-i18n="auth.forgot"></button>
        </form>
        <!-- Google Sign-In: shown when GOOGLE_CLIENT_ID is set on the server -->
        <div id="googleWrap" class="hidden"><div class="divider" data-i18n="auth.or"></div><div id="googleBtn" class="google-btn"></div></div>
      </div>

      <!-- 6-digit code sent by email to confirm the address -->
      <form class="auth-card card hidden" id="codeCard" novalidate>
        <div class="code-badge"><i data-icon="mail" data-size="26"></i></div>
        <h2 data-i18n="code.title"></h2>
        <p class="muted code-text"><span id="codeText"></span> <strong id="codeEmail" dir="ltr"></strong></p>
        <!-- One real input (so paste and phone autofill work) laid over six boxes that show its digits -->
        <div class="code-field" id="codeField" dir="ltr">
          <div class="code-slots" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
          <input id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" data-i18n-aria="code.label" aria-describedby="codeError">
        </div>
        <p class="code-error" id="codeError" role="alert"></p>
        <button class="btn btn-primary btn-block btn-lg" id="codeSubmit" data-i18n="code.verify"></button>
        <p class="muted small code-help" data-i18n="code.spam"></p>
        <div class="code-actions">
          <button type="button" class="link-btn" id="resendCode"></button>
          <button type="button" class="link-btn" data-back data-i18n="code.change"></button>
        </div>
      </form>

      <!-- Forgot password -->
      <form class="auth-card card hidden" id="forgotCard">
        <h2 style="margin-bottom:8px" data-i18n="auth.forgotTitle"></h2>
        <p class="muted" style="margin-bottom:18px" data-i18n="auth.forgotSub"></p>
        <div class="field" style="margin-bottom:16px"><label for="fEmail" data-i18n="auth.email"></label><input class="input" id="fEmail" type="email" required></div>
        <button class="btn btn-primary btn-block" data-i18n="auth.sendLink"></button>
        <button type="button" class="link-btn" style="margin-top:14px" data-back data-i18n="auth.backLogin"></button>
      </form>

      <!-- New password (from the email link) -->
      <form class="auth-card card hidden" id="resetCard">
        <h2 style="margin-bottom:8px" data-i18n="auth.resetTitle"></h2>
        <p class="muted" style="margin-bottom:18px" data-i18n="auth.pwHint"></p>
        <div class="field" style="margin-bottom:16px"><label for="newPw" data-i18n="auth.newPassword"></label><input class="input" id="newPw" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn btn-primary btn-block" data-i18n="auth.resetBtn"></button>
      </form>

      <!-- Email verification result -->
      <div class="auth-card card hidden" id="verifyCard" style="text-align:center">
        <div class="k-icon kpi-icon" style="margin:0 auto 16px;--kc:#2e9e74" id="verifyIcon"><i data-icon="mail" data-size="24"></i></div>
        <h2 id="verifyTitle" data-i18n="common.loading"></h2>
        <p class="muted" id="verifyText" style="margin:10px 0 20px"></p>
        <a class="btn btn-primary" href="/auth.html" id="verifyBtn" data-i18n="auth.continue"></a>
      </div>
    </section>
  </main>
  <!-- Animation libraries: GSAP (+ScrollTrigger, SplitText). Lenis smooth scrolling is loaded by app.js. If they fail to load, the site still works. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/public.js"></script>
</body>
</html>
