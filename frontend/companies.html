<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Companies — JobFinder.ma</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#2e9e74">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js"></script>
</head>
<body data-page="companies">
  <main class="container">
    <div class="page-head">
      <span class="eyebrow fade-up" id="countLabel" data-i18n="common.loading"></span>
      <h1 class="fade-up" style="--d:.05s" data-i18n-html="dir.title"></h1>
      <p class="muted fade-up" style="--d:.1s" data-i18n="dir.sub"></p>
    </div>

    <div class="card fade-up" style="--d:.15s;margin-bottom:28px">
      <div class="input-icon" style="margin-bottom:14px"><i data-icon="search"></i><input class="input" id="dq" data-i18n-ph="dir.searchPh"></div>
      <div class="checkbox-row" id="dSectors"></div>
    </div>

    <!-- Companies that have open offers -->
    <section id="hiringBlock" class="hidden" style="margin-bottom:40px">
      <div class="toolbar"><div><h2 style="font-size:1.4rem" data-i18n="dir.hiring"></h2><p class="muted small" data-i18n="dir.hiringSub"></p></div></div>
      <div class="dir-grid" id="hiringGrid"></div>
    </section>

    <!-- Public directory -->
    <section id="directory">
      <div class="toolbar"><div><h2 style="font-size:1.4rem" data-i18n="dir.directory"></h2><p class="muted small" data-i18n="dir.directorySub"></p></div></div>
      <div class="dir-grid" id="dirGrid"></div>
      <div class="pagination" id="dirPages"></div>
    </section>
  </main>
  <!-- Animation libraries: GSAP (+ScrollTrigger, SplitText). Lenis smooth scrolling is loaded by app.js. If they fail to load, the site still works. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/public.js"></script>
</body>
</html>
