<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e9e74">
  <title>Offline — JobFinder.ma</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; background: #fcf9f4; color: #2c2a33; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #18161e; color: #f1ece4; } p { color: #b0aab8 !important; } }
    img { width: 72px; height: 72px; border-radius: 20px; }
    h1 { font-size: 1.4rem; margin: 18px 0 8px; }
    p { margin: 0 0 6px; color: #6c6877; line-height: 1.5; }
    button { margin-top: 18px; padding: 12px 22px; border: 0; border-radius: 12px; background: #2e9e74; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your internet connection, then try again.</p>
    <p dir="auto">Vous êtes hors ligne. Vérifiez votre connexion.</p>
    <p dir="rtl">أنت غير متصل بالإنترنت. تحقق من اتصالك.</p>
    <button onclick="location.reload()">Try again / Réessayer / إعادة المحاولة</button>
  </main>
</body>
</html>
